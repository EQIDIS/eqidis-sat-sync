{% load i18n %}
<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerrar Sesión | Eqidis</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --eq-primary: oklch(0.4732 0.1282 298.476);
        --eq-primary-content: oklch(1 0 0);
        --eq-secondary: oklch(0.6747 0.1568 20.3063);
      }
    </style>
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <img src="/static/assets/logoDark.svg" alt="Eqidis" class="h-8 mx-auto" />
    </div>

    <div class="card bg-base-100 shadow-xl border border-base-300 rounded-2xl">
      <div class="card-body text-center">
        <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-base-200 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-base-content/50" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
          </svg>
        </div>

        <h2 class="text-xl font-bold mb-2">Cerrar sesión</h2>
        <p class="text-base-content/60 mb-6">¿Estás seguro de que deseas cerrar tu sesión?</p>

        <form method="post" action="{% url 'account_logout' %}">
          {% csrf_token %}
          <div class="flex gap-3 justify-center">
            <a href="/" class="btn btn-ghost rounded-xl">Cancelar</a>
            <button type="submit" class="btn rounded-xl text-white border-none" style="background-color: var(--eq-primary);">
              Cerrar sesión
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
